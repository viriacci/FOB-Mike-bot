name: Materialize package

on:
  push:
    branches:
      - main
    paths:
      - ".package-ready"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and extract audited package
        shell: bash
        run: |
          set -euo pipefail
          cat .package-parts/part-* > /tmp/package.b64
          base64 -d /tmp/package.b64 > /tmp/package.zip
          unzip -t /tmp/package.zip
          unzip -o /tmp/package.zip -d .
          rm -f wojsko-discord-bot-final-audited-seg13-hotfix.zip
          rm -rf .package-parts
          rm -f .package-ready
          rm -f .github/workflows/materialize.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit exact package contents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Materialize audited Segment 13 source"
          git push
